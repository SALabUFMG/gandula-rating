[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gandula-rating"
version = "0.1.0"
description = "Player rating system using VAEP and Gandula package"
readme = "README.md"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "matplotlib",
    "scikit-learn",
    "gandula",
    "tqdm",
    "jupyter",
    "ipykernel>=6.29.5",
    "python-dotenv>=1.0.1",
    "kloppy>=3.16.0",
    "matplotsoccer>=0.0.8",
    "socceraction>=1.5.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "isort",
    "mypy",
    "flake8",
]

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"] 
